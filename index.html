<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#09090f"
    >

    <meta
        name="description"
        content="Lucy - Alles uit je hoofd."
    >

    <title>Lucy - Alles uit je hoofd.</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <!-- ======================================
         HOOFDPAGINA
         ====================================== -->

    <main
        id="paginaHoofd"
        class="pagina actief"
    >

        <section class="lucy-start">

            <div class="lucy-logo-blok">

                <h1 class="lucy-logo">
                    LUCY
                </h1>

                <p class="lucy-ondertitel">
                    Alles uit je hoofd.
                </p>

            </div>


            <!-- GEDACHTE INVOER -->

            <form
                id="snelToevoegenForm"
                class="snel-toevoegen-form"
            >

                <label
                    for="snelInput"
                    class="visueel-verborgen"
                >
                    Gedachte
                </label>

                <textarea
                    id="snelInput"
                    name="gedachte"
                    class="snel-input"
                    placeholder="Gooi hier alles uit je hoofd..."
                    autocomplete="off"
                    autocapitalize="sentences"
                    spellcheck="true"
                    rows="8"
                ></textarea>


                <button
                    type="submit"
                    class="snel-opslaan-knop"
                >
                    OPSLAAN
                </button>

            </form>


            <!-- ======================================
                 GROTE VERWERKEN KNOP
                 ====================================== -->

            <button
                type="button"
                id="verwerkKnop"
                class="grote-verwerk-knop"
            >

                <span class="verwerk-icoon">
                    🧠
                </span>

                <span class="verwerk-tekst">
                    VERWERKEN
                </span>

                <span class="verwerk-uitleg">
                    Bekijk je gedachten
                </span>

            </button>

        </section>

    </main>



    <!-- ======================================
         VERWERK PAGINA
         ====================================== -->

    <main
        id="paginaVerwerken"
        class="pagina"
    >

        <section class="verwerken-pagina">

            <!-- PAGINA KOP -->

            <header class="verwerken-header">

                <button
                    type="button"
                    id="terugNaarLucy"
                    class="terug-knop"
                >
                    ← LUCY
                </button>


                <div class="verwerken-titel-blok">

                    <h1>
                        VERWERKEN
                    </h1>

                    <p>
                        Wat wil je met deze gedachten doen?
                    </p>

                </div>

            </header>



            <!-- ======================================
                 GEDACHTEN
                 ====================================== -->

            <section
                id="verwerkLijst"
                class="verwerk-lijst"
                aria-live="polite"
            >
                <!-- Gedachten worden hier door
                     script.js geplaatst -->
            </section>


            <!-- ======================================
                 GEEN GEDACHTEN
                 ====================================== -->

            <div
                id="legeVerwerkLijst"
                class="lege-verwerk-lijst"
                hidden
            >

                <div class="lege-verwerk-icoon">
                    🧠
                </div>

                <h2>
                    Je hoofd is leeg.
                </h2>

                <p>
                    Er staan geen gedachten meer
                    te verwerken.
                </p>

                <button
                    type="button"
                    class="terug-naar-lucy-groot"
                    onclick="paginaOpenen('paginaHoofd')"
                >
                    ← TERUG NAAR LUCY
                </button>

            </div>

        </section>

    </main>



    <!-- ======================================
         JAVASCRIPT
         ====================================== -->

    <script src="script.js"></script>

</body>

</html>
